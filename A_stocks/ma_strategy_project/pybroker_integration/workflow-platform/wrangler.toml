# Cloudflare Workers：静态 SPA + /api 同源反代到香港后端
name = "pybroker-trade-vue"
main = "worker.js"
compatibility_date = "2024-09-23"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# /api/* 先走 Worker 反代，其余走静态资源
run_worker_first = ["/api/*", "/api"]

[vars]
API_ORIGIN = "https://api.freealpha.lol"
