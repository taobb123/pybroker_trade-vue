# 推送到 main 且后端相关文件变更时，SSH 到香港 ECS 同步并重启 workflow-api
name: Deploy workflow-api (HK ECS)

on:
  push:
    branches: [main]
    paths:
      - "A_stocks/ma_strategy_project/pybroker_integration/workflow_server.py"
      - "A_stocks/ma_strategy_project/pybroker_integration/db.py"
      - "A_stocks/ma_strategy_project/pybroker_integration/auth_api.py"
      - "A_stocks/ma_strategy_project/pybroker_integration/admin_api.py"
      - "A_stocks/ma_strategy_project/pybroker_integration/membership_api.py"
      - "A_stocks/ma_strategy_project/pybroker_integration/membership_service.py"
      - "A_stocks/ma_strategy_project/pybroker_integration/payment_api.py"
      - "A_stocks/ma_strategy_project/pybroker_integration/onboarding_api.py"
      - "A_stocks/ma_strategy_project/pybroker_integration/events_api.py"
      - "A_stocks/ma_strategy_project/pybroker_integration/events_service.py"
      - "A_stocks/ma_strategy_project/pybroker_integration/rate_limit.py"
      - "A_stocks/ma_strategy_project/pybroker_integration/requirements.txt"
      - "A_stocks/ma_strategy_project/pybroker_integration/config/workflow_runner.yaml"
      - "A_stocks/ma_strategy_project/pybroker_integration/scripts/sync_workflow_api_on_server.sh"
      - ".github/workflows/deploy-workflow-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-workflow-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: 22
          script_stop: true
          script: |
            set -euo pipefail
            REPO_DIR="${{ secrets.ECS_REPO_DIR }}"
            APP_DIR="${{ secrets.ECS_APP_DIR }}"
            if [ -z "${REPO_DIR}" ]; then REPO_DIR=/root/pybroker_trade-vue; fi
            if [ -z "${APP_DIR}" ]; then APP_DIR=/root/workflow-api; fi
            export REPO_DIR APP_DIR DEPLOY_BRANCH=main
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "ERROR: 服务器尚未 git clone。请先按部署文档 §1.3 一次性初始化。"
              exit 1
            fi
            cd "$REPO_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            SYNC="$REPO_DIR/A_stocks/ma_strategy_project/pybroker_integration/scripts/sync_workflow_api_on_server.sh"
            chmod +x "$SYNC"
            bash "$SYNC"
