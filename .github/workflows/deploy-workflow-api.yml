# 推送到 main 时同步全量 pybroker_integration 到香港 ECS 并重启
name: Deploy workflow-api (HK ECS)

on:
  push:
    branches: [main]
    paths:
      - "A_stocks/ma_strategy_project/pybroker_integration/**"
      - "!A_stocks/ma_strategy_project/pybroker_integration/workflow-platform/**"
      - ".github/workflows/deploy-workflow-api.yml"
  workflow_dispatch:

concurrency:
  group: deploy-workflow-api
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.ECS_HOST }}
          username: ${{ secrets.ECS_USER }}
          key: ${{ secrets.ECS_SSH_KEY }}
          port: 22
          script_stop: true
          # 可选：GitHub Secrets 设 TUSHARE_TOKEN / MVP_JWT_SECRET / MX_APIKEY，会写入服务环境
          envs: TUSHARE_TOKEN,MVP_JWT_SECRET,MX_APIKEY
          script: |
            set -euo pipefail
            REPO_DIR="${{ secrets.ECS_REPO_DIR }}"
            if [ -z "${REPO_DIR}" ]; then REPO_DIR=/root/pybroker_trade-vue; fi
            export REPO_DIR DEPLOY_BRANCH=main
            export TUSHARE_TOKEN="${{ secrets.TUSHARE_TOKEN }}"
            export MVP_JWT_SECRET="${{ secrets.MVP_JWT_SECRET }}"
            export MX_APIKEY="${{ secrets.MX_APIKEY }}"
            if [ ! -d "$REPO_DIR/.git" ]; then
              echo "ERROR: 服务器尚未 git clone。请先按部署文档初始化。"
              exit 1
            fi
            cd "$REPO_DIR"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            SYNC="$REPO_DIR/A_stocks/ma_strategy_project/pybroker_integration/scripts/sync_workflow_api_on_server.sh"
            chmod +x "$SYNC"
            bash "$SYNC"
        env:
          TUSHARE_TOKEN: ${{ secrets.TUSHARE_TOKEN }}
          MVP_JWT_SECRET: ${{ secrets.MVP_JWT_SECRET }}
          MX_APIKEY: ${{ secrets.MX_APIKEY }}
